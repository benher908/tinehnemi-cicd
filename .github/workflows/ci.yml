name: CI/CD Pipeline - Tinehnemi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint (pruebas de calidad de codigo)
        run: npm run lint

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Simular despliegue
        run: |
          echo "Build validado y pruebas superadas."
          echo "Listo para publicar (ej. eas build / expo publish)."
