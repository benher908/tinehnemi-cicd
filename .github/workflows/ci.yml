name: CI/CD Pipeline - Tinehnemi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  DEPLOY_URL: https://benher908.github.io/tinehnemi-cicd/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint (pruebas de calidad de codigo)
        run: npm run lint

  release:
    name: Release (entorno de liberacion)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Dar permisos de ejecucion a los scripts
        run: chmod +x scripts/*.sh

      - name: Generar entorno de liberacion (build web)
        run: ./scripts/build-release.sh dist

      - name: Ejecutar pruebas sobre el entorno de liberacion
        run: ./scripts/test-release.sh dist

      - name: Publicar artefacto de liberacion
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ env.DEPLOY_URL }}
    permissions:
      contents: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar artefacto de liberacion
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Dar permisos de ejecucion a los scripts
        run: chmod +x scripts/*.sh

      - name: Generar el despliegue (publicar en GitHub Pages)
        run: ./scripts/deploy.sh dist gh-pages
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Prueba de humo sobre el entorno de despliegue
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ env.DEPLOY_URL }}"
